version: '3.8'

services:
  # MySQL 8 Database Service for SmartHR Lanka
  mysql:
    image: mysql:8.0
    container_name: smarthr_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_secure_pass
      MYSQL_DATABASE: smarthr_lanka
      MYSQL_USER: smarthr_user
      MYSQL_PASSWORD: smarthr_secure_pass
      TZ: Asia/Colombo
    ports:
      - "3307:3306"
    volumes:
      - smarthr_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "smarthr_user", "-psmarthr_secure_pass"]
      interval: 10s
      timeout: 5s
      retries: 5

  # SmartHR Lanka Node.js / Express API Backend
  backend:
    build:
      context: ./server
      dockerfile: ../Dockerfile.backend
    container_name: smarthr_backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "mysql://smarthr_user:smarthr_secure_pass@mysql:3306/smarthr_lanka"
      CLIENT_URL: "http://localhost"
      JWT_SECRET: "smarthr_lanka_jwt_super_secure_production_secret_key_2026"
      JWT_REFRESH_SECRET: "smarthr_lanka_jwt_refresh_secure_production_secret_key_2026"
      DEFAULT_TIMEZONE: "Asia/Colombo"
      DEFAULT_CURRENCY: "LKR"
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy

  # SmartHR Lanka React / Vite / Nginx Frontend
  frontend:
    build:
      context: ./client
      dockerfile: ../Dockerfile.frontend
    container_name: smarthr_frontend
    restart: always
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      - backend

volumes:
  smarthr_mysql_data:
    driver: local
